section("Build 9 · the editor, its cursor cell and the new menus fit (DOM measurement)");
function measureBuild9(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  const same = h0 => Math.abs(L().height - h0) < 0.5;
  const unclipped = el => el.scrollWidth <= el.clientWidth + 0.5;
  const lcdBg = getComputedStyle(lcd).backgroundColor, lcdInk = getComputedStyle(lcd).color;
  const rev = el => !!el && getComputedStyle(el).backgroundColor === lcdInk && getComputedStyle(el).color === lcdBg;
  const textBox = el => { const rg = document.createRange(); rg.selectNodeContents(el); return rg.getBoundingClientRect(); };
  const lines = () => {
    const byTop = new Map();
    for (const i of h.querySelectorAll(".lcd-mi")) { const t = Math.round(i.getBoundingClientRect().top); byTop.set(t, [...(byTop.get(t) || []), glyphText(i)]); }
    return [...byTop.keys()].sort((a, b) => a - b).map(t => byTop.get(t).join(" ")).join(" / ");
  };
  press("AC ON AC SHIFT 9 3 = AC");
  const h0 = L().height;
  for (const [keys, label] of [
    ["MODE 3 1", "the empty 1-VAR editor"],
    ["MODE 3 1 1 2 , 5 = (−) 3 = 7 = ▲", "1-VAR with 12,5, −3 and 7, cursor on 7"],
    [`${FQ} MODE 3 1 ${Array.from({ length: 10 }, (_, k) => `${k + 1} =`).join(" ")} ▶ ▲ ▲`, "1-VAR FREQ with ten rows, cursor on a FREQ"],
    [`${FQR} 1 2 , 5 = (−) 3 = ▶ ▲ ▲ 1 0 0 = 2 = ▶ ▲ ▲ 3 =`, "A+BX X | Y | FREQ with 12,5, −3, 100"],
  ]) {
    press(`AC AC AC ON AC SHIFT 9 3 = AC ${keys}`);
    const t = h.querySelector("table.lcd-stat"), cells = t ? [...t.querySelectorAll("th,td")] : [];
    const sel = t ? [...t.querySelectorAll("td.lcd-tbl-sel")] : [], others = t ? [...t.querySelectorAll("td:not(.lcd-tbl-sel)")] : [];
    tick(!!t && t.rows.length === 4 && cells.every(inside) && cells.every(unclipped) && same(h0),
         `${where}: ${label}: heading + three rows inside the LCD, no cell cut, LCD height unchanged`,
         `${t ? t.rows.length : 0} rows, LCD ${Math.round(h0)} → ${Math.round(L().height)} px, ${cells.filter(c => !inside(c)).length} outside, ${cells.filter(c => !unclipped(c)).length} cut`);
    tick(sel.length === 1 && rev(sel[0]) && others.every(c => getComputedStyle(c).backgroundColor === "rgba(0, 0, 0, 0)") && !t.querySelector("u")
         && getComputedStyle(sel[0]).animationName === "none" && sel[0].getBoundingClientRect().height >= 9,
         `${where}: ${label}: ONE cursor cell, inverted (dark cell, light digits), steady, no underline`, `ink ${lcdInk}, LCD ${lcdBg}`);
    const res = h.querySelector(".lcd-res.lcd-tbl-val"), fCell = parseFloat(getComputedStyle(sel[0] || t).fontSize);
    const v = res && res.textContent !== "" ? textBox(res) : null;
    tick(!!res && inside(res) && (v == null || (L().right - v.right < 14 && v.left > L().left + L().width / 2)) && parseFloat(getComputedStyle(res).fontSize) > 2 * fCell && !h.querySelector(".lcd-eqn-in"),
         `${where}: ${label}: the cursor cell's value "${res ? res.textContent : ""}" bottom right, big, inside the LCD`, `${res ? getComputedStyle(res).fontSize : "none"} against ${fCell}px cells`);
  }
  // typing: bottom left, a blinking cursor after it, no value bottom right
  press("AC AC AC ON AC SHIFT 9 3 = AC MODE 3 1 5 = 7 = 9 = ▲ ▲ 1 2 3 4 5 6 , 7 8");
  const tin = h.querySelector(".lcd-eqn-in"), cur = tin && tin.querySelector(".calc-cursor"), ex = tin && tin.querySelector(".lcd-expr"), tb = h.querySelector("table.lcd-stat");
  let tr = null;
  if (ex && cur) { const rg = document.createRange(); rg.setStart(ex, 0); rg.setEndBefore(cur); tr = rg.getBoundingClientRect(); }   // the typed digits only
  tick(!!tin && !!cur && inside(tin) && same(h0) && !h.querySelector(".lcd-res") && tr.left - L().left < 16 && tr.right < L().left + L().width / 2 + 40
       && cur.getBoundingClientRect().left >= tr.right - 1 && getComputedStyle(cur).animationName === "calc-blink" && tin.getBoundingClientRect().top >= tb.getBoundingClientRect().bottom - 0.5,
       `${where}: typing 123456,78: bottom LEFT under the grid, a blinking cursor after it, nothing bottom right, LCD height unchanged`,
       `text ${tr ? Math.round(tr.left - L().left) : "?"}…${tr ? Math.round(tr.right - L().left) : "?"} px from the LCD's left, LCD ${Math.round(L().height)} px`);
  // the menus
  for (const [keys, label, want] of [
    ["AC SHIFT 1", "the editor's short menu", "1:Type 2:Data / 3:Edit"],   // AC cancels the typing, the editor stays
    ["3", "Edit", "1:Ins 2:Del-A"],
    ["AC AC AC AC ON AC SHIFT 9 3 = AC MODE 3 2 1 = 2 = 3 = 4 = ▶ ▲ ▲ ▲ ▲ 2 = 4 = 5 = 8 = AC SHIFT 1 3", "A+BX Sum (four lines)", "1:Σx² 2:Σx / 3:Σy² 4:Σy / 5:Σxy 6:Σx³ / 7:Σx²y 8:Σx⁴"],
    ["AC 4", "A+BX Var (four lines)", `1:n 2:${XBAR} / 3:σx 4:sx / 5:${YBAR9} 6:σy / 7:sy`],
    ["AC 6", "A+BX MinMax", "1:minX 2:maxX / 3:minY 4:maxY"],

}

/* ---- DOM measurements: GCD( on the line, its answer and the Argument
   ERROR screen fit the LCD at 375 px (the overlay) and in the in-question
   calculator ---- */
section("Build 10 · GCD( and Argument ERROR fit (DOM measurement)");
function measureBuild10(where, h, press) {
  const lcd = h.querySelector(".calc-lcd");
  const L = () => lcd.getBoundingClientRect();
  const inside = el => { const b = el.getBoundingClientRect(), l = L(); return b.left >= l.left - 0.5 && b.right <= l.right + 0.5 && b.top >= l.top - 0.5 && b.bottom <= l.bottom + 0.5; };
  press("AC AC ON AC 1 + 1 =");
  const h0 = L().height;
  press("AC GCD 12 ; 18 =");
  const ex = h.querySelector(".lcd-expr"), res = h.querySelector(".lcd-res");
  tick(read(h).val === "6" && inside(ex) && inside(res) && ex.scrollWidth <= ex.clientWidth + 0.5 && Math.abs(L().height - h0) < 0.5,
       `${where}: GCD(12;18 and its answer 6 sit inside the LCD, the line uncut, height unchanged`, `LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  press("AC GCD 12 , 5 ; 3 =");
  const lines = [...h.querySelectorAll(".lcd-err > div")];
  const over = lines.filter(d => d.scrollWidth > d.clientWidth + 0.5 || !inside(d));
  tick(lines.length === 3 && over.length === 0 && Math.abs(L().height - h0) < 0.5,
       `${where}: the three Argument ERROR lines fit inside the LCD and do not change its height`,
       `${lines.length} lines, overflowing: ${over.length}, LCD ${Math.round(h0)} → ${Math.round(L().height)} px`);
  press("AC 1 ÷ 7000000 = S⇔D");
  const r2 = h.querySelector(".lcd-res");
  tick(read(h).val === "0,00000014285" && inside(r2) && r2.scrollWidth <= r2.clientWidth + 0.5,
       `${where}: the cut decimal 0,00000014285 fits the answer line`, `${r2.scrollWidth}/${r2.clientWidth} px`);
  press("AC");
}
{
  openCalculator();
  const scrim = document.querySelector(".calc-scrim");
  const press = seq => keyIds(seq).forEach(id => scrim.querySelector(`[data-keyid="${id}"]`).click());
  measureBuild10(`overlay at ${window.innerWidth} px`, scrim, press);
  scrim.querySelector(".calc-close").click();
  const fit = document.getElementById("fitHost");
  const c = freshCalc(fit);
  measureBuild10(`in-question calculator, ${Math.round(fit.getBoundingClientRect().width)} px wide`, fit, c.press);
  fit.innerHTML = "";
}
