<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PenWorks</title>
<meta name="theme-color" content="#262A30">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/calc.css">
</head>
<body>

<div id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <h1 class="wordmark">PenWorks</h1>
    <label for="lu">Username</label>
    <input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="lp">Password</label>
    <div class="pwField">
      <input id="lp" name="password" type="password" autocomplete="current-password" required>
      <button id="eyeBtn" class="eye" type="button" aria-label="Show password" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 20L20 4"/></svg>
      </button>
    </div>
    <button id="loginBtn" type="submit">Log in</button>
    <p id="loginMsg" role="status"></p>
  </form>
</div>

<div id="app" hidden>
  <!-- the folder view (Samsung's folder list, with the note names showing under each folder) -->
  <aside id="side" aria-label="Folders">
    <div class="top"><span class="wordmark">PenWorks</span><span id="modeNote" class="modeNote"></span></div>
    <div id="folderList"></div>
    <div class="foot"><button id="logoutBtn" class="logout" type="button">Log out</button><span class="footR"><span id="saveDot" class="saveDot" data-state="saved" title="All saved" role="img" aria-label="All saved"></span><button id="trayBtn" class="ib trayBtn" type="button" aria-label="Move tray to the left"></button><button id="themeBtn" class="ib themeBtn" type="button" aria-label="Dark mode"></button></span></div>
  </aside>

  <main id="main">
    <!-- the grid of notes (or the Bin) for the selected folder -->
    <section id="listView">
      <div id="gridBar" class="bar">
        <button id="gridBack" class="ib phoneOnly" type="button" aria-label="Folders">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="gridTitle"></h2>
      </div>
      <div id="grid"></div>
    </section>

    <!-- the open note: header, then every page stacked on the desk -->
    <section id="noteView" hidden>
      <div id="noteBar" class="bar">
        <button id="backBtn" class="ib" type="button" aria-label="Back to the notes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        </button>
        <div id="noteName"></div>
        <span class="saveDot" data-state="saved" title="All saved" role="img" aria-label="All saved"></span>
        <button id="prevBtn" class="ib phoneOnly" type="button" aria-label="Previous page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <span id="barCount" class="phoneOnly"></span>
        <button id="nextBtn" class="ib phoneOnly" type="button" aria-label="Next page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button id="listBtn" class="ib" type="button" aria-label="Page list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="9" rx="1"/><rect x="13.5" y="3.5" width="7" height="9" rx="1"/><rect x="3.5" y="15" width="7" height="5.5" rx="1"/><rect x="13.5" y="15" width="7" height="5.5" rx="1"/></svg>
        </button>
        <button id="addPageBtn" class="ib" type="button" aria-label="Add a page below this one">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="1.5"/><path d="M12 8.5v7M8.5 12h7"/></svg>
        </button>
        <button id="fsBtn" class="ib" type="button" aria-label="Full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <button id="noteMore" class="ib" type="button" aria-label="More">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
      </div>
      <div id="noteBody">
        <div id="desk">
          <div id="stack">
            <button id="addBelow" type="button">Add a page below</button>
          </div>
        </div>
        <div id="counter" aria-live="polite"></div>
        <button id="exitFs" type="button" aria-label="Leave full screen" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        </button>
        <!-- pw-v7b: the zoom lock; outside #desk, so no stroke or pan ever starts under it -->
        <button id="zoomLock" type="button" aria-label="Lock zoom" aria-pressed="false">
          <svg class="lockOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 6.8-1.2"/></svg>
          <svg class="lockShut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8.5 11V7.5a3.5 3.5 0 0 1 7 0V11"/></svg>
        </button>
        <aside id="pageList" aria-label="Pages" hidden>
          <div class="plHead">
            <button id="plAll" type="button" aria-label="Tick every page" aria-pressed="false" hidden><span class="box"></span><span class="lbl">All</span></button>
            <b id="plCount" class="grow"></b>
            <b id="plSel" class="grow" hidden></b>
            <button id="plMarks" class="ib" type="button" aria-label="Show bookmarked pages only" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M7 3.5h10v17l-5-4.2-5 4.2z"/></svg>
            </button>
            <button id="plSelect" class="plWord" type="button">Select</button>
            <button id="plDone" class="plWord" type="button" hidden>Done</button>
            <button id="plClose" class="ib" type="button" aria-label="Close the page list">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
          </div>
          <div id="plThumbs"></div>
          <div id="plBar" hidden></div>
        </aside>
      </div>
    </section>
  </main>

  <aside id="tray" aria-label="Pen tray">
    <button id="undoBtn" class="ib" type="button" aria-label="Undo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 17.5a8 8 0 0 0-13.7-5.6L4 14.2"/><path d="M4 8.5v5.7h5.7"/></svg>
    </button>
    <button id="redoBtn" class="ib" type="button" aria-label="Redo" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5a8 8 0 0 1 13.7-5.6L20 14.2"/><path d="M20 8.5v5.7h-5.7"/></svg>
    </button>
  </aside>
</div>

<div id="menu" hidden role="menu"></div>
<div id="toast" role="status"></div>
<input id="pdfInput" type="file" accept="application/pdf" hidden>

<script type="module" src="./js/app.js"></script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
